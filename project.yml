name: Foolscap
options:
  bundleIdPrefix: com.foolscap
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 4J2T5H73JM
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
  configs:
    # Debug: ad-hoc, no prompts. Release: Developer ID with a secure
    # timestamp; scripts/release.sh notarizes and staples the DMG.
    Debug:
      CODE_SIGN_IDENTITY: "-"
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application: SEANAN MC CULLOUGH (4J2T5H73JM)"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      # Release only: notarization requires it; test bundles can't inject
      # into a hardened host, so Debug stays plain.
      ENABLE_HARDENED_RUNTIME: YES
      # xcodebuild build (not archive) injects get-task-allow, which
      # notarization rejects.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    branch: main
targets:
  Foolscap:
    type: application
    platform: macOS
    sources:
      - path: Sources/Foolscap
      # A folder reference: lands as Contents/Resources/Fonts, which
      # Fonts.register() expects.
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Resources/help.md
        buildPhase: resources
      - path: Resources/export.css
        buildPhase: resources
    dependencies:
      - package: Markdown
        product: Markdown
    settings:
      base:
        # Dev bundle id; the Store listing's com.foolscap.app moves over at
        # parity (PLAN.md, Phase 5) — two apps with one id confuse Launch
        # Services on a machine that runs both.
        PRODUCT_BUNDLE_IDENTIFIER: com.foolscap.native
        PRODUCT_NAME: Foolscap
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 HEAVYSTACK"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown, public.plain-text]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
        CFBundleURLTypes:
          - CFBundleURLName: Foolscap link
            CFBundleURLSchemes: [foolscap]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdx]
  FoolscapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/FoolscapTests
      # Fixtures ride in the test bundle: reading them from the repo under
      # ~/Documents at run time trips a TCC consent check in the host app
      # that stalls the first reader by a minute or more.
      - path: fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Foolscap
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Foolscap.app/Contents/MacOS/Foolscap
        BUNDLE_LOADER: $(TEST_HOST)
  FoolscapUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/FoolscapUITests]
    dependencies:
      - target: Foolscap
    settings:
      base:
        TEST_TARGET_NAME: Foolscap
schemes:
  Foolscap:
    build:
      targets: { Foolscap: all, FoolscapTests: [test], FoolscapUITests: [test] }
    run:
      config: Debug
    test:
      config: Debug
      targets: [FoolscapTests, FoolscapUITests]
      environmentVariables:
        - variable: UPDATE_GOLDENS
          value: "1"
          isEnabled: false
