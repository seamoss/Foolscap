name: Release

# Tag vX.Y.Z → build, sign, notarize, publish to GitHub Releases.
#
# Required repository secrets:
#   macOS signing + notarization:
#     CSC_LINK                      base64 .p12 Developer ID certificate
#     CSC_KEY_PASSWORD              its password
#     APPLE_ID                      notarytool Apple ID
#     APPLE_APP_SPECIFIC_PASSWORD   app-specific password
#     APPLE_TEAM_ID                 team id
#   Windows (Azure Trusted Signing — ULTRAPLAN §7):
#     AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
#     (plus win.azureSignOptions in electron-builder.yml)
# Without the secrets, builds still publish — unsigned.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # macOS-only for now — nobody here runs the others (README: Platform).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify tag matches package.json
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "tag is $GITHUB_REF_NAME but package.json says $PKG" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - name: Build and publish
        # Signing env is exported only when the secrets actually exist: a
        # missing secret interpolates to "", and electron-builder treats a
        # set-but-empty CSC_LINK as a certificate path ("not a file").
        run: |
          if [ -n "$SECRET_CSC_LINK" ]; then
            export CSC_LINK="$SECRET_CSC_LINK"
            export CSC_KEY_PASSWORD="$SECRET_CSC_KEY_PASSWORD"
            export APPLE_ID="$SECRET_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$SECRET_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm exec electron-vite build
          pnpm exec electron-builder --mac --arm64 --x64 --publish never
        env:
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Publish release assets
        # gh, not electron-builder's publisher: its per-arch publish contexts
        # raced and created two releases on one tag (observed at v0.5.0).
        # Notes are written by hand afterward; the feed only needs the tag.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "Foolscap ${GITHUB_REF_NAME#v}" --notes "" || true
          gh release upload "$GITHUB_REF_NAME" \
            dist/*.dmg dist/*-mac.zip dist/*.blockmap --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
