# Packaging (Phase 5). Local unsigned build: `pnpm pack:app` (--dir) or
# `pnpm dist`. Signing and notarization activate automatically when the CI
# secrets are present — see .github/workflows/release.yml.
appId: com.foolscap.app
productName: Foolscap
copyright: © 2026 HEAVYSTACK
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  # The PDF exporter embeds these; require.resolve works in dev but not in
  # the packaged app, so they ship as plain resources (src/main/export/pdf.ts
  # checks process.resourcesPath/fonts first).
  - from: node_modules/@fontsource-variable/recursive/files/recursive-latin-full-normal.woff2
    to: fonts/recursive-latin-full-normal.woff2
  - from: node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-normal.woff2
    to: fonts/fraunces-latin-full-normal.woff2
  - from: fonts/ioskeley
    to: fonts/ioskeley
fileAssociations:
  - ext: [md, markdown, mdx]
    name: Markdown
    description: Markdown document
    role: Editor
    rank: Alternate
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  # Runs only on signed builds (skipped whenever signing is skipped), using
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID from the env.
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip # electron-updater feeds from the zip
      arch: [arm64, x64]
mas:
  # Mac App Store edition: App Sandbox instead of hardened runtime, Apple
  # Distribution signing, and a provisioning profile from the portal
  # (download to build/foolscap-mas.provisionprofile — gitignored).
  # Build: pnpm dist:store (never electron-builder directly — the script
  # builds with FOOLSCAP_EDITION=store and verifies the result). Upload
  # with Transporter.
  #
  # No self-update machinery of any kind ships in this edition: App Review
  # rejects apps that add update checks to the Store's own. So: no
  # node_modules in the asar (electron-updater and its dependencies are the
  # app's only runtime packages), a main bundle that never imports the
  # library, and no app-update.yml feed descriptor — that one needs the
  # top-level `publish` block gone entirely (a per-target null doesn't stop
  # it), which dist-store.cjs does by deriving a publish-less config.
  # A complete list, not just the negation: a files list that starts with a
  # negation makes electron-builder begin from the whole project tree.
  files:
    - out/**
    - package.json
    - '!**/node_modules/**'
  artifactName: '${productName}-${version}-mas-${arch}.${ext}'
  hardenedRuntime: false
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  provisioningProfile: build/foolscap-mas.provisionprofile
  # Pinned: the keychain also holds an employer's distribution certs, and
  # auto-discovery must never reach for those.
  identity: SEANAN MC CULLOUGH (4J2T5H73JM)
  extendInfo:
    # Standard HTTPS only — skips App Store Connect's encryption questionnaire.
    ITSAppUsesNonExemptEncryption: false
dmg:
  # Quiet drag-to-Applications window; no fancy background.
  contents:
    - x: 130
      y: 180
    - x: 410
      y: 180
      type: link
      path: /Applications
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  # Azure Trusted Signing (ULTRAPLAN §7): configure via env in CI —
  # AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET and
  # win.azureSignOptions. Unsigned local builds work but SmartScreen-flag.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  category: Office
  maintainer: sean@noisebeard.com
  target: [AppImage, deb, rpm]
afterPack: ./scripts/ad-hoc-sign.cjs
publish:
  # Releases are the update-notifier's feed (src/main/update-check.ts) and
  # will feed electron-updater too once a Developer ID signs the build.
  # releaseType matters: the default is a draft, and drafts are invisible
  # to releases/latest — the feed would never advance.
  provider: github
  owner: seamoss
  repo: Foolscap
  releaseType: release
